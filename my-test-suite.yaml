name: "my-test-suite"
description: "my-test-suite evaluation suite"
provider: ollama
model: llama3.2
system_prompt: "You are a helpful assistant."
max_tokens: 512

cases:
  - id: "example-exact-match"
    prompt: "What is the capital of France? Reply with just the city name."
    criteria:
      - type: exact_match
        value: "Paris"
        case_sensitive: false

