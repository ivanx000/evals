name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Cache dashboard-ui node_modules
        uses: actions/cache@v4
        with:
          path: dashboard-ui/node_modules
          key: ${{ runner.os }}-node-dashboard-ui-${{ hashFiles('dashboard-ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-dashboard-ui-

      - name: Install dashboard-ui dependencies
        run: cd dashboard-ui && npm ci

      - name: Test dashboard-ui
        run: cd dashboard-ui && npm test
